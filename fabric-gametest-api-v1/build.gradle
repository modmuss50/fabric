plugins {
	id 'jvm-test-suite'
}

version = getSubprojectVersion(project)

loom {
	accessWidenerPath = file("src/main/resources/fabric-gametest-api-v1.classtweaker")

	runs {
		testmodClient {
			client()
			name = "Testmod Client"
			vmArg "-Dfabric-api.gametest.structures.output-dir=${file("src/testmod/resources/data/fabric-gametest-api-v1-testmod/gametest/structure")}"

			ideConfigGenerated = false
			source sourceSets.testmodClient
		}
	}
}

moduleDependencies(project, [
	'fabric-api-base',
	'fabric-registry-sync-v0',
	'fabric-resource-loader-v1',
])

dependencies {
	api "org.junit.platform:junit-platform-engine:6.0.2"
	implementation ("net.fabricmc:fabric-loader-junit:${project.loader_version}") {
		transitive = false
	}
}


testing.suites {
	gametests(JvmTestSuite) {
		useJUnitJupiter()

		dependencies {
			implementation project()
		}

		targets.all {
			testTask.configure {
				testDefinitionDirs.from("src/test/definitions")
			}
		}
	}
}
