import net.fabricmc.fabric.impl.build.FabricApiBuildUtils
import org.gradle.api.publish.maven.MavenPublication

plugins {
	id "version-catalog"
	id "fabric-api.base-publishing"
}

version = FabricApiBuildUtils.rootVersion(project)

publishing.publications {
	register('mavenJava', MavenPublication) {
		from components.versionCatalog
	}
}

remoteSign {
	sign publishing.publications.mavenJava
}

tasks.withType(GenerateModuleMetadata).configureEach {
	enabled = true
}

for (proj in rootProject.allprojects) {
	if (proj == project || proj.name == "fabric-api-testmod") {
		continue
	}

	String catalogName = proj.name
	if (catalogName == 'fabric-api-base') {
		catalogName = 'base'
	} else if (catalogName == 'fabric-api-bom') {
		catalogName = 'bom'
	} else if (catalogName == 'deprecated') {
		catalogName = 'deprecated-fabric-api'
	} else if (catalogName == 'fabric-api') {
		catalogName = 'fabric-api'
	} else {
		catalogName = catalogName.substring('fabric-'.length())
	}

	if (proj.parent != null && proj.parent.name == 'deprecated') {
		catalogName = 'deprecated-' + catalogName
	}

	catalog {
		versionCatalog {
			def moduleVersion = FabricApiBuildUtils.isMetaProject(proj) || proj.path == ":"
					? project.version
					: FabricApiBuildUtils.moduleVersion(project, proj.name)
			library(catalogName, "net.fabricmc.fabric-api:${proj.name}:${moduleVersion}")
		}
	}
}
