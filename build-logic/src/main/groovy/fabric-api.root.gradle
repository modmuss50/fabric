import net.fabricmc.fabric.impl.build.FabricApiBuildUtils
import net.fabricmc.loom.build.nesting.NestableJarGenerationTask
import net.fabricmc.loom.task.NestJarsAction

plugins {
	id "fabric-api.root-versioning"
	id "fabric-api.java"
	id "fabric-api.lint"
	id "net.fabricmc.fabric-loom-repositories"
	id "fabric-api.root-publishing"
}

tasks.withType(ProcessResources).configureEach {
	def modVersion = project.version.toString()
	inputs.property "version", modVersion
	filesMatching("fabric.mod.json") {
		expand "version": modVersion
	}
}

["runClient", "runServer", "runClientGametest", "runGametest", "runAutoTestServer", "runTestmodClient", "runTestmodServer"].each { taskName ->
	tasks.register(taskName) {
		group = "fabric"
		dependsOn ":fabric-api-testmod:${taskName}"
	}
}

tasks.register("generateResources") {
	group = "fabric"
}

configurations {
	nestedJars {
		transitive = false
		FabricApiBuildUtils.configureJavaRuntimeJarVariant(delegate)
	}
}

def includedModuleProjects = rootProject.allprojects.findAll {
	FabricApiBuildUtils.isFabricModule(it) && it != project
}

dependencies {
	for (def moduleProject : includedModuleProjects) {
		api project(path: moduleProject.path)

		if (!FabricApiBuildUtils.DEV_ONLY_MODULES.contains(moduleProject.name)) {
			nestedJars project(moduleProject.path)
		}
	}
}

def processNestedJars = tasks.register("processNestedJars", NestableJarGenerationTask) {
	from configurations.nestedJars
	outputDirectory = layout.buildDirectory.dir("nestedJars")
	uncompressNestedJars = true
}

def nestedJarFiles = fileTree(processNestedJars.flatMap { it.outputDirectory }).matching {
	include "*.jar"
}

tasks.named("jar", Jar) {
	dependsOn processNestedJars
	NestJarsAction.addToTask(delegate, nestedJarFiles)
}

tasks.register("checkNoDuplicateFiles", Zip) {
	inputs.files configurations.nestedJars
	destinationDirectory = layout.buildDirectory.dir("test")

	from {
		configurations.nestedJars.files.collect { zipTree(it) }
	}

	exclude 'META-INF/**'
	exclude 'fabric.mod.json'
}

check.dependsOn "checkNoDuplicateFiles"
