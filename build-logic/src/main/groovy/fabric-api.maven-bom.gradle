import net.fabricmc.fabric.impl.build.FabricApiBuildUtils
import org.gradle.api.publish.maven.MavenPublication

plugins {
	id "java-platform"
	id "fabric-api.base-publishing"
}

version = FabricApiBuildUtils.rootVersion(project)

publishing.publications {
	register('mavenJava', MavenPublication) {
		from(components['javaPlatform'])
	}
}

remoteSign {
	sign publishing.publications.mavenJava
}

tasks.withType(GenerateModuleMetadata).configureEach {
	enabled = true
}

dependencies {
	constraints {
		for (proj in rootProject.allprojects) {
			if (proj == project || proj.name in ['fabric-api-catalog', 'fabric-api-testmod']) {
				continue
			}

			api(project(proj.path))
		}
	}
}
