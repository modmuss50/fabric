import net.fabricmc.fabric.impl.build.FabricApiBuildUtils

plugins {
	id "checkstyle"
	id "com.diffplug.spotless"
}

checkstyle {
	configFile = isolated.rootProject.projectDirectory.file("checkstyle.xml").asFile
	toolVersion = FabricApiBuildUtils.version(project, "checkstyle")
}

spotless {
	lineEndings = 'UNIX'

	java {
		licenseHeaderFile(isolated.rootProject.projectDirectory.file("HEADER").asFile)
		removeUnusedImports()
		importOrder('java', 'javax', '', 'net.minecraft', 'net.fabricmc')
		leadingSpacesToTabs()
		trimTrailingWhitespace()
	}

	json {
		target 'src/**/lang/en_us.json'
		targetExclude 'src/**/generated/**'
		gson().indentWithSpaces(2).sortByKeys()
	}
}

if (project == rootProject) {
	spotless {
		groovyGradle {
			target 'src/**/*.gradle', '*.gradle', 'gradle/*.gradle'
			greclipse()
		}
	}
}
