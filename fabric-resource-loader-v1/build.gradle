plugins {
	id 'fabric-api.module'
}

loom {
	accessWidenerPath = file("src/main/resources/fabric-resource-loader-v1.classtweaker")
}

fabricApiModule {
	moduleDependencies(
		'fabric-api-base'
	)

	testDependencies(
		':fabric-lifecycle-events-v1',
		':fabric-api-base',
		':fabric-gametest-api-v1',
		':fabric-resource-conditions-api-v1',
		':fabric-resource-loader-v1'
	)
}

// Setup 3 test mods used for testing resource sorting
sourceSets {
	testmodA
	testmodB
	testmodC
}

[sourceSets.testmodA, sourceSets.testmodB, sourceSets.testmodC].each { sourceSet ->
	dependencies {
		testmodImplementation sourceSet.output
	}

	tasks.register("${sourceSet.name}Jar", Jar) {
		from sourceSet.output
		archiveBaseName.set(sourceSet.name)
	}
}

loom.nestJars(tasks.named("testmodJar"), project.files(
	tasks.testmodAJar,
	tasks.testmodBJar,
	tasks.testmodCJar
))
